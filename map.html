<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARD Area Facilities Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root{
    --hard: #2f7d4f;
    --coh:  #2563eb;
    --husd: #d97706;
    --biz:  #9333ea;
    --landmark: #dc2626;
    --ink:  #1f2937;
    --muted:#6b7280;
    --line: #e5e7eb;
    --bg:   #f7f8f6;
    --panel:#ffffff;
    --accent:#2f7d4f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  #sidebar{
    width:320px;
    min-width:320px;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  #sidebar-header{
    padding:18px 18px 12px;
    border-bottom:1px solid var(--line);
  }
  #sidebar-header h1{
    font-size:17px;
    margin:0 0 2px;
    font-weight:700;
    color:var(--ink);
  }
  #sidebar-header p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }

  #search-wrap{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  #search{
    width:100%;
    padding:9px 12px;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
    background:var(--bg);
  }
  #search:focus{
    border-color:var(--accent);
    background:#fff;
  }
  #result-count{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }

  .layer-block{
    border-bottom:1px solid var(--line);
    padding:14px 18px;
  }
  .layer-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
  }
  .swatch{
    width:11px;height:11px;border-radius:50%;flex:none;
  }
  .layer-count{
    margin-left:auto;
    font-weight:400;
    color:var(--muted);
    font-size:12px;
  }
  .chevron{
    font-size:10px;
    color:var(--muted);
    transition:transform .15s ease;
    width:10px;
  }
  .layer-block.collapsed .chevron{ transform:rotate(-90deg); }
  .layer-body{ margin-top:10px; }
  .layer-block.collapsed .layer-body{ display:none; }

  .filter-group{ margin-top:10px; }
  .filter-group:first-child{ margin-top:0; }
  .filter-group-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-size:12px;
    padding:4px 9px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--chip-color, var(--accent));
    border-color:var(--chip-color, var(--accent));
    color:#fff;
  }
  .chip .n{ opacity:.75; margin-left:3px; font-size:10.5px; }

  #reset-btn{
    margin:14px 18px;
    padding:9px 12px;
    font-size:13px;
    border:1px solid var(--line);
    background:var(--bg);
    border-radius:8px;
    cursor:pointer;
    color:var(--ink);
    text-align:center;
  }
  #reset-btn:hover{ background:#eef0ec; }

  #map{ flex:1; height:100%; }

  .leaflet-popup-content-wrapper{ border-radius:10px; }
  .popup{ font-size:13px; line-height:1.45; max-width:260px; }
  .popup h3{
    margin:0 0 4px;
    font-size:14.5px;
    color:var(--ink);
  }
  .popup .src-tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:2px 7px;
    border-radius:5px;
    color:#fff;
    margin-bottom:6px;
  }
  .popup .addr{ color:var(--muted); margin-bottom:6px; }
  .popup .field{ margin-top:6px; }
  .popup .field b{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600; margin-bottom:1px; }
  .popup .sessions{ max-height:150px; overflow-y:auto; }
  .popup .session{ font-size:12px; padding:3px 0; border-bottom:1px solid #eef0f2; }
  .popup .session:last-child{ border-bottom:0; }
  .popup .session b{ display:inline; font-size:12px; text-transform:none; letter-spacing:0; color:inherit; }
  .popup .session .course{ color:var(--muted); font-size:11px; }
  .popup a.site-link{
    display:inline-block;
    margin-top:8px;
    font-size:12.5px;
    font-weight:600;
    color:var(--accent);
    text-decoration:none;
  }
  .popup a.site-link:hover{ text-decoration:underline; }

  .marker-pin{
    width:28px; height:28px; border-radius:50%;
    background:#fff;
    border:2.5px solid var(--pin-color, #333);
    box-shadow:0 1px 3px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    line-height:1;
  }

  .legend-control{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
    font-size:12.5px;
    color:var(--ink);
    overflow:hidden;
  }
  #legend-toggle{
    display:block;
    width:100%;
    padding:7px 12px;
    background:var(--panel);
    border:none;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
    text-align:left;
  }
  #legend-toggle:hover{ background:var(--bg); }
  #legend-panel{
    padding:2px 12px 10px;
    max-height:50vh;
    overflow-y:auto;
  }
  #legend-panel.hidden{ display:none; }
  .legend-section{ margin-top:10px; }
  .legend-section:first-child{ margin-top:6px; }
  .legend-section-title{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-weight:700;
    margin-bottom:4px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:7px;
    padding:2px 0;
    white-space:nowrap;
  }
  .legend-glyph{
    width:20px;height:20px;border-radius:50%;flex:none;
    background:#fff;
    border:2px solid;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }

  @media (max-width: 720px){
    body{ flex-direction:column; }
    #sidebar{ width:100%; min-width:0; max-height:45vh; }
    #map{ flex:1; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>HARD Area Facilities</h1>
    <p>Community centers, parks &amp; recreation facilities, city sites, and school district sites across the Hayward Area Recreation &amp; Park District.</p>
  </div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search by name or address…" autocomplete="off">
    <div id="result-count"></div>
  </div>

  <div id="layers"></div>

  <button id="reset-btn">Reset filters</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="map_data.js"></script>
<script src="events.js"></script>
<script src="classes.js"></script>
<script>
// events.js is rebuilt daily from the haywardrec.org calendar by build_events.py
// (GitHub Action). If it's missing, the map still works with an empty Events layer.
MAP_DATA.events = (typeof EVENTS_DATA !== 'undefined') ? EVENTS_DATA : { type: 'FeatureCollection', features: [] };

// classes.js is rebuilt monthly from the current Recreation Guide PDFs by build_classes.py.
// Between rebuilds, drop sessions (and whole classes) whose dates have already passed.
const TODAY = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in the viewer's time zone
MAP_DATA.classes = (() => {
  const src = (typeof CLASSES_DATA !== 'undefined') ? CLASSES_DATA : { features: [] };
  const features = [];
  src.features.forEach(f => {
    const sessions = f.properties.sessions.filter(s => !s.end || s.end >= TODAY);
    if (!sessions.length) return;
    const starts = sessions.map(s => s.start).filter(Boolean).sort();
    const first = starts[0];
    const starts_label = !first || first <= TODAY
      ? 'In progress'
      : new Date(first + 'T12:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    features.push({ ...f, properties: { ...f.properties, sessions, starts: starts_label } });
  });
  return { type: 'FeatureCollection', guides: src.guides || [], features };
})();
// events are dropped the day after they happen, too
MAP_DATA.events.features = MAP_DATA.events.features.filter(f => !f.properties.date || f.properties.date >= TODAY);

const LAYER_DEFS = [
  {
    key: 'classes',
    label: 'HARD Classes',
    color: '#0d9488',
    colorHex: '#0d9488',
    defaultOn: true,
    note: () => MAP_DATA.classes.guides.length
      ? `From the ${MAP_DATA.classes.guides.join(' & ')} Recreation Guide${MAP_DATA.classes.guides.length > 1 ? 's' : ''} · past classes hidden`
      : 'From the HARD Recreation Guide',
    filters: [
      { field: 'interest', label: 'Interest' },
      { field: 'age_groups', label: 'Ages' },
      { field: 'starts', label: 'Starts' },
    ],
  },
  {
    key: 'events',
    label: 'Upcoming Events',
    color: '#db2777',
    colorHex: '#db2777',
    defaultOn: true,
    note: () => MAP_DATA.events.updated
      ? `From the HARD calendar · updated ${MAP_DATA.events.updated}`
      : 'From the HARD calendar',
    filters: [
      { field: 'age_group', label: 'Ages' },
      { field: 'month', label: 'Month' },
    ],
  },
  {
    key: 'hard',
    label: 'HARD Facilities',
    color: 'var(--hard)',
    colorHex: '#2f7d4f',
    defaultOn: true,
    filters: [
      { field: 'subcategory', label: 'Type' },
    ],
  },
  {
    key: 'coh',
    label: 'City of Hayward & Partners',
    color: 'var(--coh)',
    colorHex: '#2563eb',
    defaultOn: true,
    filters: [
      { field: 'category', label: 'Category' },
    ],
  },
  {
    key: 'husd',
    label: 'HUSD School Sites',
    color: 'var(--husd)',
    colorHex: '#d97706',
    defaultOn: false,
    filters: [
      { field: 'category', label: 'Grade Level' },
      { field: 'subcategory', label: 'Org' },
    ],
  },
  {
    key: 'business',
    label: 'Local Businesses',
    color: 'var(--biz)',
    colorHex: '#9333ea',
    defaultOn: false,
    filters: [
      { field: 'category', label: 'Type' },
    ],
  },
  {
    key: 'landmark',
    label: 'Named Landmarks',
    color: 'var(--landmark)',
    colorHex: '#dc2626',
    defaultOn: false,
    filters: [
      { field: 'category', label: 'Type' },
    ],
  },
];

const map = L.map('map', { zoomControl: true }).setView([37.665, -122.083], 12);

// BASEMAPS
// CARTO's free tiles now require an API key (without one they show an "API key required"
// watermark / fail). The default below is Esri, which needs no key. If you prefer the CARTO
// Voyager look, request a free key at https://www.carto.com/basemaps/apikey/ and paste it here.
const CARTO_API_KEY = '';

const ESRI_ATTR = 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012';
const basemaps = {
  'Streets': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: ESRI_ATTR,
  }),
  'Light': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, maxNativeZoom: 16, attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
  }),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
  }),
};
if (CARTO_API_KEY) {
  basemaps['Voyager (CARTO)'] = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=' + encodeURIComponent(CARTO_API_KEY), {
    maxZoom: 20,
    subdomains: 'abcd',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  });
}
(CARTO_API_KEY ? basemaps['Voyager (CARTO)'] : basemaps['Streets']).addTo(map);
L.control.layers(basemaps, null, { position: 'topright', collapsed: true }).addTo(map);

// district outline, drawn once as a reference layer (not toggleable, not clustered)
if (MAP_DATA.boundary) {
  L.geoJSON(MAP_DATA.boundary, {
    style: { color: '#374151', weight: 2, opacity: 0.55, fill: true, fillOpacity: 0.03, dashArray: '5,4' },
    interactive: false,
  }).addTo(map);
}

// mini clip-art icons per facility subcategory, shown inside the marker pin
const ICONS = {
  classes: {
    'Tech, Coding & STEM': '🤖',
    'Music & Dance': '🎵',
    'Arts & Crafts': '🎨',
    'Sports': '🏀',
    'Martial Arts': '🥋',
    'Fitness & Wellness': '🧘',
    'Swimming': '🏊',
    'Nature & Outdoors': '🌿',
    'Cooking & Baking': '🧁',
    'Theater & Performing': '🎭',
    'Games & Gaming': '🎮',
    'Languages': '💬',
    'Preschool': '🧸',
    'Special Events': '🎉',
    'Volunteering': '🤝',
    'Adaptive & Inclusive': '♿',
  },
  events: {
    'Young Kids': '🧸',
    'Teens & Youth': '🎧',
    'Adults & Seniors': '☕',
    'All Ages': '🎉',
  },
  hard: {
    'Center': '🏢',
    'Center - Senior': '🧓',
    'Sports': '⚽',
    'Pool': '🏊',
    'Museum': '🖼️',
    'Theater': '🎭',
    'Garden': '🌷',
    'Park': '🌳',
  },
  coh: {
    'Other Facility': '🏢',
    'Youth': '🧒',
    'Library': '📚',
    'Sports Park': '⚽',
    'Mall': '🛍️',
    'Museum': '🖼️',
  },
  husd: {},
  business: {
    'Boba / Bubble Tea': '🧋',
    'Arcade': '🕹️',
    'Mall / Shopping Center': '🛍️',
    'Movie Theater': '🎬',
    'Coffee Shop': '☕',
    'Bowling Alley': '🎳',
    'Dance Studio': '💃',
    'Art / Craft Studio': '🎨',
    'Cooking Class': '🍳',
    'Gym / Fitness Center': '💪',
    'Martial Arts Studio': '🥋',
    'Board Game Cafe': '🎲',
    'Game Shop': '♟️',
  },
  landmark: {
    'Regional Park / Lake': '🏞️',
    'Music Venue': '🎸',
    'Bowling Alley': '🎳',
    'Shopping Center': '🛍️',
    'Hiking Trailhead': '🥾',
  },
};
const DEFAULT_ICON = { classes: '📘', events: '📅', hard: '📍', coh: '📍', husd: '🏫', business: '📍', landmark: '📍' };

// CoH's "subcategory" is a program label (e.g. "Youth"), not a facility type, so it
// mis-icons a few sites (e.g. a swim club tagged "Youth" got the person icon). Override by name.
const ICON_NAME_OVERRIDES = {
  'Southgate Swim Club': '🏊',
  'Matt Jimenez Community Center': '🏢',
};

function iconFor(layerKey, feature) {
  const name = feature.properties.name;
  if (ICON_NAME_OVERRIDES[name]) return ICON_NAME_OVERRIDES[name];
  const sub = layerKey === 'events' ? feature.properties.age_group
    : layerKey === 'classes' ? feature.properties.interest
    : feature.properties.subcategory;
  return (ICONS[layerKey] && ICONS[layerKey][sub]) || DEFAULT_ICON[layerKey] || '📍';
}

// state: per layer, set of active filter values per field
const state = {};
LAYER_DEFS.forEach(def => {
  state[def.key] = { on: def.defaultOn, filters: {} };
  def.filters.forEach(f => { state[def.key].filters[f.field] = new Set(); });
});

// cluster groups per layer
const clusterGroups = {};
const allMarkersByLayer = {}; // key -> [{feature, marker}]

// a property can be a single value or a list (e.g. a class open to both Kids and Teens)
const valuesOf = (props, field) => {
  const v = props[field];
  if (Array.isArray(v)) return v.length ? v : ['Unspecified'];
  return [v || 'Unspecified'];
};

// fields whose chips keep a fixed, meaningful order instead of most-common-first
const FIXED_ORDER = {
  age_groups: ['Young Kids (0–5)', 'Kids (6–12)', 'Teens (13–17)', 'Adults (18+)', 'Seniors (50+)'],
  age_group: ['Young Kids', 'Teens & Youth', 'Adults & Seniors', 'All Ages'],
};
const monthOrder = label => label === 'In progress' ? -1 : (Date.parse('1 ' + label) || 9e15);

function fieldValues(features, field) {
  const counts = new Map();
  features.forEach(f => valuesOf(f.properties, field).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)));
  const entries = [...counts.entries()];
  if (FIXED_ORDER[field]) return entries.sort((a, b) => FIXED_ORDER[field].indexOf(a[0]) - FIXED_ORDER[field].indexOf(b[0]));
  if (field === 'month' || field === 'starts') return entries.sort((a, b) => monthOrder(a[0]) - monthOrder(b[0]));
  return entries.sort((a, b) => b[1] - a[1]);
}

const SRC_TAGS = {
  Class: { color: '#0d9488', label: 'HARD Class' },
  Event: { color: '#db2777', label: 'Event' },
  HARD: { color: '#2f7d4f', label: 'HARD' },
  CoH: { color: '#2563eb', label: 'City of Hayward' },
  HUSD: { color: '#d97706', label: 'HUSD' },
  Business: { color: '#9333ea', label: 'Local Business' },
  Landmark: { color: '#dc2626', label: 'Landmark' },
};

// event text is scraped from the calendar, so escape it before it goes into the popup
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function eventPopupHtml(raw) {
  const props = Object.fromEntries(Object.entries(raw).map(([k, v]) => [k, esc(v)]));
  let html = `<div class="popup">`;
  html += `<span class="src-tag" style="background:${SRC_TAGS.Event.color}">Event · ${props.age_group}</span>`;
  html += `<h3>${props.name}</h3>`;
  html += `<div class="field"><b>When</b>${props.when}${props.time ? ' · ' + props.time : ''}</div>`;
  html += `<div class="field"><b>Where</b>${props.venue}${props.address ? `<br><span class="addr">${props.address}</span>` : ''}</div>`;
  if (props.description) html += `<div class="field">${props.description}</div>`;
  html += `<a class="site-link" href="${props.website}" target="_blank" rel="noopener">Event details &amp; sign up →</a>`;
  html += `</div>`;
  return html;
}

const DAY_NAMES = { M: 'Mon', T: 'Tue', W: 'Wed', Th: 'Thu', F: 'Fri', Sa: 'Sat', Su: 'Sun' };
const prettyDays = d => String(d || '').replace(/Th|Sa|Su|M|T|W|F/g, m => DAY_NAMES[m]);

function classPopupHtml(p) {
  const MAX = 6;
  let html = `<div class="popup">`;
  html += `<span class="src-tag" style="background:${SRC_TAGS.Class.color}">HARD Class · ${esc(p.interest)}</span>`;
  html += `<h3>${esc(p.name)}</h3>`;
  html += `<div class="addr">${esc(p.venue)}</div>`;
  if (p.ages) html += `<div class="field"><b>Ages</b>${esc(p.ages)}</div>`;
  html += `<div class="field"><b>Dates</b><div class="sessions">`;
  p.sessions.slice(0, MAX).forEach(s => {
    const bits = [
      `<b>${esc(s.dates)}</b>`,
      [prettyDays(s.days), esc(s.time)].filter(Boolean).join(' '),
      s.meetings ? `${s.meetings} class${s.meetings === 1 ? '' : 'es'}` : '',
      esc(s.price),
    ].filter(Boolean);
    const ages = p.sessions.some(x => x.ages !== p.sessions[0].ages) && s.ages ? ` · ${esc(s.ages)}` : '';
    html += `<div class="session">${bits.join(' · ')}${ages} <span class="course">#${esc(s.course)}</span></div>`;
  });
  if (p.sessions.length > MAX) html += `<div class="session">+ ${p.sessions.length - MAX} more session${p.sessions.length - MAX === 1 ? '' : 's'}</div>`;
  html += `</div></div>`;
  if (p.description) html += `<div class="field">${esc(p.description)}</div>`;
  html += `<a class="site-link" href="${esc(p.website)}" target="_blank" rel="noopener">Register for this class →</a>`;
  if (p.browse_url) html += `<a class="site-link" style="display:block;margin-top:4px" href="${esc(p.browse_url)}" target="_blank" rel="noopener">${esc(p.browse_label)} →</a>`;
  html += `<div class="field" style="color:var(--muted);font-size:11px;margin-top:6px;">${esc(p.guide)} Recreation Guide</div>`;
  html += `</div>`;
  return html;
}

function popupHtml(props) {
  if (props.source === 'Class') return classPopupHtml(props);
  if (props.source === 'Event') return eventPopupHtml(props);
  const tag = SRC_TAGS[props.source] || SRC_TAGS.HARD;
  let html = `<div class="popup">`;
  html += `<span class="src-tag" style="background:${tag.color}">${tag.label}</span>`;
  html += `<h3>${props.name || ''}</h3>`;
  if (props.address) html += `<div class="addr">${props.address}</div>`;

  const meta = [];
  if (props.subcategory) meta.push(props.subcategory);
  if (props.category && props.category !== props.subcategory) meta.push(props.category);
  if (meta.length) html += `<div class="field"><b>Type</b>${meta.join(' · ')}</div>`;

  if (props.amenities) html += `<div class="field"><b>Amenities</b>${props.amenities}</div>`;
  if (props.reservable_rooms && props.reservable_rooms !== 'None') html += `<div class="field"><b>Reservable Rooms</b>${props.reservable_rooms}</div>`;
  if (props.reservable_other && props.reservable_other !== 'None') html += `<div class="field"><b>Reservable Spaces</b>${props.reservable_other}</div>`;
  if (props.primary_operator) html += `<div class="field"><b>Operator</b>${[props.primary_operator, props.secondary_operator].filter(Boolean).join(' / ')}</div>`;
  if (props.notes) html += `<div class="field"><b>Notes</b>${props.notes}</div>`;

  if (props.rating) {
    const reviews = props.user_ratings_total ? ` (${props.user_ratings_total} reviews)` : '';
    html += `<div class="field"><b>Rating</b>${props.rating}★${reviews}${props.price_level ? ' · ' + props.price_level : ''}</div>`;
  }
  if (props.source === 'Business') html += `<div class="field" style="color:var(--muted);font-size:11px;">Data: Google</div>`;

  if (props.website) html += `<a class="site-link" href="${props.website}" target="_blank" rel="noopener">View details &amp; reserve →</a>`;
  html += `</div>`;
  return html;
}

function buildLayer(def) {
  // a missing layer shows as empty instead of stopping the whole map from loading
  const fc = MAP_DATA[def.key] || (MAP_DATA[def.key] = { type: 'FeatureCollection', features: [] });
  const group = L.markerClusterGroup({
    maxClusterRadius: 45,
    iconCreateFunction: cluster => {
      const count = cluster.getChildCount();
      return L.divIcon({
        html: `<div style="background:${def.colorHex};color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">${count}</div>`,
        className: '',
        iconSize: [34,34],
      });
    }
  });

  const entries = [];
  fc.features.forEach(feature => {
    const [lon, lat] = feature.geometry.coordinates;
    const icon = L.divIcon({
      className: '',
      html: `<div class="marker-pin" style="--pin-color:${def.colorHex}">${iconFor(def.key, feature)}</div>`,
      iconSize: [28,28],
      iconAnchor: [14,14],
    });
    const marker = L.marker([lat, lon], { icon });
    marker.bindPopup(popupHtml(feature.properties));
    entries.push({ feature, marker });
  });

  clusterGroups[def.key] = group;
  allMarkersByLayer[def.key] = entries;
}

LAYER_DEFS.forEach(buildLayer);

// fields searched beyond name/address, so e.g. "tennis" finds facilities with Tennis Courts listed
const SEARCH_FIELDS = ['name', 'address', 'venue', 'description', 'age_group', 'interest', 'section', 'amenities', 'reservable_rooms', 'reservable_other', 'notes', 'subcategory', 'category'];

function searchHaystack(props) {
  return SEARCH_FIELDS.map(f => props[f] || '').join(' ').toLowerCase();
}

function matchesFilters(def, feature) {
  const f = state[def.key].filters;
  for (const field in f) {
    if (f[field].size === 0) continue; // no filter active on this field = allow all
    if (!valuesOf(feature.properties, field).some(v => f[field].has(v))) return false;
  }
  return true;
}

const searchInput = document.getElementById('search');

function currentSearchTerm() {
  return searchInput.value.trim().toLowerCase();
}

function refreshMap() {
  const term = currentSearchTerm();
  let shown = 0;

  LAYER_DEFS.forEach(def => {
    const group = clusterGroups[def.key];
    group.clearLayers();
    if (!state[def.key].on) {
      if (map.hasLayer(group)) map.removeLayer(group);
      return;
    }
    const toAdd = [];
    allMarkersByLayer[def.key].forEach(({feature, marker}) => {
      if (!matchesFilters(def, feature)) return;
      if (term && !searchHaystack(feature.properties).includes(term)) return;
      toAdd.push(marker);
    });
    group.addLayers(toAdd);
    shown += toAdd.length;
    if (!map.hasLayer(group)) map.addLayer(group);
  });

  document.getElementById('result-count').textContent = `${shown} result${shown===1?'':'s'} shown`;
}

function renderSidebar() {
  const container = document.getElementById('layers');
  container.innerHTML = '';

  LAYER_DEFS.forEach(def => {
    const total = MAP_DATA[def.key].features.length;
    const block = document.createElement('div');
    block.className = 'layer-block';
    block.dataset.key = def.key;

    const title = document.createElement('div');
    title.className = 'layer-title';
    title.innerHTML = `
      <input type="checkbox" ${state[def.key].on ? 'checked' : ''} data-role="toggle">
      <span class="swatch" style="background:${def.color}"></span>
      <span>${def.label}</span>
      <span class="layer-count">${total}</span>
      <span class="chevron">▾</span>
    `;
    block.appendChild(title);

    const body = document.createElement('div');
    body.className = 'layer-body';

    if (def.note) {
      const note = document.createElement('div');
      note.className = 'filter-group-label';
      note.style.textTransform = 'none';
      note.style.letterSpacing = '0';
      note.textContent = def.note();
      body.appendChild(note);
    }
    if (total === 0) {
      const empty = document.createElement('div');
      empty.className = 'filter-group-label';
      empty.style.textTransform = 'none';
      empty.textContent = 'No upcoming events posted right now.';
      body.appendChild(empty);
    }

    def.filters.forEach(fdef => {
      const group = document.createElement('div');
      group.className = 'filter-group';
      const label = document.createElement('div');
      label.className = 'filter-group-label';
      label.textContent = fdef.label;
      group.appendChild(label);

      const chipList = document.createElement('div');
      chipList.className = 'chip-list';
      const values = fieldValues(MAP_DATA[def.key].features, fdef.field);
      values.forEach(([val, count]) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.style.setProperty('--chip-color', def.colorHex);
        chip.innerHTML = `${val}<span class="n">${count}</span>`;
        chip.addEventListener('click', () => {
          const set = state[def.key].filters[fdef.field];
          if (set.has(val)) { set.delete(val); chip.classList.remove('active'); }
          else { set.add(val); chip.classList.add('active'); }
          refreshMap();
        });
        chipList.appendChild(chip);
      });
      group.appendChild(chipList);
      body.appendChild(group);
    });

    block.appendChild(body);
    container.appendChild(block);

    title.addEventListener('click', (e) => {
      if (e.target.dataset.role === 'toggle') return;
      block.classList.toggle('collapsed');
    });
    title.querySelector('[data-role="toggle"]').addEventListener('click', (e) => {
      e.stopPropagation();
      state[def.key].on = e.target.checked;
      refreshMap();
    });

    // every section starts collapsed; click its title to see the filters
    block.classList.add('collapsed');
  });
}

searchInput.addEventListener('input', () => {
  refreshMap();
  const term = currentSearchTerm();
  if (!term) return;
  // fly to first match across active layers
  for (const def of LAYER_DEFS) {
    if (!state[def.key].on) continue;
    const hit = allMarkersByLayer[def.key].find(({feature}) => {
      if (!matchesFilters(def, feature)) return false;
      return searchHaystack(feature.properties).includes(term);
    });
    if (hit) {
      clusterGroups[def.key].zoomToShowLayer(hit.marker, () => hit.marker.openPopup());
      break;
    }
  }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  searchInput.value = '';
  LAYER_DEFS.forEach(def => {
    state[def.key].on = def.defaultOn;
    def.filters.forEach(f => state[def.key].filters[f.field].clear());
  });
  renderSidebar();
  refreshMap();
  map.setView([37.665, -122.083], 12);
});

const LegendControl = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd: function () {
    const div = L.DomUtil.create('div', 'legend-control');
    const sections = LAYER_DEFS.map(def => {
      const entries = [...Object.entries(ICONS[def.key] || {}), ['Other', DEFAULT_ICON[def.key]]];
      const rows = entries.map(([label, glyph]) => `
        <div class="legend-row">
          <span class="legend-glyph" style="border-color:${def.colorHex}">${glyph}</span>
          <span>${label}</span>
        </div>`).join('');
      return `<div class="legend-section">
        <div class="legend-section-title" style="color:${def.colorHex}">${def.label}</div>
        ${rows}
      </div>`;
    }).join('');
    div.innerHTML = `
      <button id="legend-toggle" type="button">Legend ▾</button>
      <div id="legend-panel" class="hidden">${sections}</div>
    `;
    L.DomEvent.disableClickPropagation(div);
    div.querySelector('#legend-toggle').addEventListener('click', () => {
      div.querySelector('#legend-panel').classList.toggle('hidden');
    });
    return div;
  }
});
map.addControl(new LegendControl());

renderSidebar();
refreshMap();
</script>
</body>
</html>
