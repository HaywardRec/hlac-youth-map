name: Update classes

# Monthly: checks haywardrec.org/407/Current-Recreation-Guides for the current guide PDFs
# (so a new season's guide is picked up automatically) and rebuilds classes.js.
# The map also hides classes whose dates have passed on its own, between runs.
on:
  schedule:
    - cron: "0 14 1 * *"   # 1st of every month, 14:00 UTC (6–7 AM Pacific)
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh (e.g. right after a new guide is posted)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pypdf
        # [crypto] = AES support (some guide PDFs are encrypted); fonttools = cleaner text from embedded fonts
        run: pip install "pypdf[crypto]" fonttools

      - name: Build classes.js
        env:
          TZ: America/Los_Angeles
        run: python build_classes.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add classes.js classes_geocode_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update classes from HARD Recreation Guide"
            git pull --rebase
            git push
          fi
