name: Update events

# Refreshes events.js from the haywardrec.org calendar every morning.
# The GitHub Pages site (and the map embedded on the HARD website) picks up the change automatically.
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 5–6 AM Pacific
  workflow_dispatch:        # "Run workflow" button on the Actions tab for an on-demand refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build events.js
        env:
          TZ: America/Los_Angeles
        run: python build_events.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add events.js events_geocode_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update events from HARD calendar"
            git pull --rebase
            git push
          fi
